name: ztbl-user-qa
source: ztbl -50 qs & ans.txt (user-provided questions and reference answers)
items:
- id: q01
  question: What does the word “Riba” mean?
  reference_answer: Riba means excess, increase, or addition. In Shariah terminology, it implies excess compensation without due consideration, where time value of money is not considered due consideration.
- id: q02
  question: What is the relationship between interest and Riba?
  reference_answer: Interest means giving or taking an excess amount in exchange for a loan or debt. Therefore, according to the document, interest carries the same meaning/value as Riba.
- id: q03
  question: How many types of Riba are mentioned in the document?
  reference_answer: 'Two types: Riba-An-Nasiyah/Riba-Al-Quran and Riba-Al-Fadl.'
- id: q04
  question: What is Riba-An-Nasiyah?
  reference_answer: It refers to Riba associated with a loan where an additional amount is required over the principal. The document gives the example of lending Rs.100 and requiring Rs.110 after one month; the extra Rs.10 is Riba or interest.
- id: q05
  question: What is Riba-Al-Fadl?
  reference_answer: Riba-Al-Fadl is the second form of Riba identified in the document. It concerns unequal exchanges of certain commodities, and the document explains that it was prohibited to prevent it from becoming a means of obtaining Riba-An-Nasiyah.
- id: q06
  question: What are the four sets of revelations concerning Riba?
  reference_answer: 'The document identifies four revelations concerning Riba: Surah Ar-Rum 30:39, Surah An-Nisaa 4:161, Surah Al-i-‘Imran 3:130, and the final prohibition in Surah Al-Baqarah 2:275–281.'
- id: q07
  question: What does the final revelation about Riba in Surah Al-Baqarah state?
  reference_answer: It states that Allah has permitted trade and prohibited Riba, and instructs believers to give up what remains of Riba. It also states that a person who repents is entitled to the principal amount.
- id: q08
  question: Does the prohibition of interest apply only to consumption loans?
  reference_answer: No. The document states that interest is prohibited whether the loan is a consumption loan or a commercial loan.
- id: q09
  question: Does the prohibition of interest apply to both Muslims and non-Muslims?
  reference_answer: Yes. The document states that there is no distinction between Muslims and non-Muslims, or between individuals and states, regarding the prohibition of interest.
- id: q10
  question: What is one major difference between conventional and Islamic banking regarding money?
  reference_answer: Conventional banking treats money as a commodity in addition to being a medium of exchange and store of value. Islamic banking does not treat money as a commodity and therefore does not permit selling or renting money itself.
