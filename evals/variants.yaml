# Pipeline variants to compare. Unset fields use platform settings (.env / config/rag.yaml).
# Run:  python -m app.evaluation --dataset evals/datasets/northwind.yaml --variants evals/variants.yaml
k_values: [1, 3, 5, 8]

variants:
  # Production default: hybrid + RRF(k=60) + cross-encoder
  - name: hybrid-rrf60-rerank
    generate_answer: true

  - name: hybrid-rrf60-norerank
    rerank: false

  - name: hybrid-rrf10-rerank
    retrieval: {rrf_k: 10}

  - name: dense-only-rerank
    use_sparse: false

  - name: sparse-only-rerank
    use_dense: false

  # Smaller / faster cross-encoder
  - name: hybrid-minilm-reranker
    reranker: {provider: fastembed, model: Xenova/ms-marco-MiniLM-L-12-v2}

  # Different embedding model (separate Qdrant collection, same data)
  - name: hybrid-bge-large
    embedding: {provider: fastembed, model: BAAI/bge-large-en-v1.5, dimension: 1024, version: v1}

  # Lexical-hash baseline embedder (no semantic model) - shows what dense semantics add
  - name: hybrid-hashing-embedder
    embedding: {provider: hashing, model: hashing-v1, dimension: 1536, version: v1}
